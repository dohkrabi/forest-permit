<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532D">
<title>คำขอใช้พื้นที่ป่า ขท.กระบี่</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.14.5/sweetalert2.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.14.5/sweetalert2.all.min.js"></script>
<style>
:root{
  --green:#14532D; --green-2:#1B6B3C; --green-soft:#D1FAE5;
  --bg:#F0F4F8; --card:#FFFFFF; --line:#E5E7EB;
  --ink:#111827; --ink-2:#6B7280; --ink-3:#9CA3AF;
  --amber:#92400E; --amber-bg:#FEF3C7;
  --blue:#1D4ED8;  --blue-bg:#DBEAFE;
  --teal:#0F766E;  --teal-bg:#CCFBF1;
  --red:#B91C1C;   --red-bg:#FEE2E2;
  --purple:#5B21B6;--purple-bg:#EDE9FE;
  --gray-bg:#F3F4F6;
  --indigo:#3730A3;--indigo-bg:#E0E7FF;
  --shadow:0 2px 16px rgba(17,24,39,.07);
  --shadow-sm:0 1px 6px rgba(17,24,39,.06);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:'Noto Sans Thai','Sarabun',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
header{
  position:sticky;top:0;z-index:20;background:var(--green);color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 12px rgba(20,83,45,.25);
}
header .ttl{flex:1;min-width:0}
header .ttl b{font-size:1.05rem;font-weight:700;display:block}
header .ttl small{font-size:.72rem;opacity:.8;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#netdot{width:9px;height:9px;border-radius:50%;background:#F87171;flex:none}
#netdot.on{background:#6EE7A0}
#syncBtn{
  border:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:#fff;
  border-radius:999px;padding:7px 16px;font:inherit;font-size:.85rem;font-weight:600;
  display:flex;align-items:center;gap:6px;
}
#syncBtn:disabled{opacity:.5}
#syncBtn .sp{width:13px;height:13px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:none;animation:spin 1s linear infinite}
#syncBtn.busy .sp{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
main{padding:16px 16px 8px;max-width:760px;margin:0 auto}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{font-size:.88rem;font-weight:700;color:var(--ink-2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.kpi b{font-size:2rem;font-weight:700;color:var(--green);display:block;line-height:1.15}
.kpi span{font-size:.78rem;color:var(--ink-2);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:0;background:#F3F4F6;border-radius:999px;
  padding:7px 14px;font:inherit;font-size:.82rem;color:var(--ink-2);
  display:flex;align-items:center;gap:6px;font-weight:500;
  box-shadow:var(--shadow-sm);
}
.chip .n{font-weight:700;color:var(--ink)}
.chip.sel{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(20,83,45,.35)}
.chip.sel .n{color:#fff}
.searchrow{display:flex;gap:8px;margin-bottom:12px}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;
  box-shadow:var(--shadow-sm);
}
input:focus,select:focus,textarea:focus,button:focus-visible{
  outline:none;border-color:var(--green-2);box-shadow:0 0 0 3px rgba(27,107,60,.15);
}
.item{
  background:var(--card);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;display:block;width:100%;text-align:left;font:inherit;
  box-shadow:var(--shadow);border:0;
}
.item:active{transform:scale(.985);transition:transform .1s}
.item .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .route{font-weight:700;font-size:1.05rem;color:var(--ink)}
.item .r2{font-size:.82rem;color:var(--ink-2);margin-top:4px}
.badge{font-size:.72rem;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.b-gray  {background:#F3F4F6;color:#374151}
.b-blue  {background:#DBEAFE;color:#1E40AF}
.b-amber {background:#FEF3C7;color:#92400E}
.b-green {background:#D1FAE5;color:#065F46}
.b-purple{background:#EDE9FE;color:#4C1D95}
.b-indigo{background:#E0E7FF;color:#3730A3}
.b-teal  {background:#CCFBF1;color:#134E4A}
.b-red   {background:#FEE2E2;color:#991B1B}
.pend{font-size:.72rem;color:#D97706;font-weight:600;white-space:nowrap}
.empty{color:var(--ink-3);text-align:center;padding:32px 10px;font-size:.9rem}
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);
  box-shadow:0 -1px 0 var(--line),0 -4px 20px rgba(17,24,39,.06);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
nav button,nav .navlink{
  flex:1;border:0;background:none;font:inherit;font-size:.72rem;color:var(--ink-3);
  padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  text-decoration:none;font-weight:500;
}
nav button .ic,nav .navlink .ic{font-size:1.3rem;line-height:1}
nav button.on{color:var(--green);font-weight:700}
#sheetWrap{position:fixed;inset:0;z-index:30;display:none}
#sheetWrap.on{display:block}
#sheetBg{position:absolute;inset:0;background:rgba(17,24,39,.5);backdrop-filter:blur(2px)}
#sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;
  background:var(--bg);border-radius:24px 24px 0 0;
  padding:8px 16px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 32px rgba(17,24,39,.15);
}
#sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 14px}
.frow{margin-bottom:12px}
.frow label{font-size:.78rem;color:var(--ink-2);font-weight:600;display:block;margin-bottom:5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;border:0;border-radius:14px;padding:13px;width:100%;font-weight:700;font-size:.95rem}
.btn-p{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(20,83,45,.3)}
.btn-o{background:var(--card);border:1.5px solid var(--line);color:var(--ink-2);box-shadow:var(--shadow-sm)}
.btnrow{display:flex;gap:10px;margin-top:16px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:.88rem}
.dl dt{color:var(--ink-2);font-weight:500}
.dl dd{text-align:right;word-break:break-word;font-weight:500}
.swal2-popup.swal2-toast{font-family:'Noto Sans Thai','Sarabun',system-ui,sans-serif!important;font-size:.88rem!important}
.swal2-popup:not(.swal2-toast){font-family:'Noto Sans Thai','Sarabun',system-ui,sans-serif!important;border-radius:20px!important}
.subhd{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.subhd h2{margin:0}
.linkbtn{border:0;background:none;font:inherit;font-size:.82rem;color:var(--green-2);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="ttl">
    <b>คำขอใช้พื้นที่ป่า</b>
    <small>แขวงทางหลวงกระบี่ · <span id="lastSync">ยังไม่เคย sync</span></small>
  </div>
  <span id="netdot" title="สถานะเครือข่าย"></span>
  <button id="syncBtn" onclick="doSync()"><span class="sp"></span><span id="syncTxt">Sync</span></button>
</header>

<main>
  <section id="v-home" class="view">
    <div class="kpis">
      <div class="kpi"><b id="kReq">–</b><span>คำขอทั้งหมด</span></div>
      <div class="kpi"><b id="kPend">–</b><span>รอ sync ขึ้นชีต</span></div>
    </div>
    <div class="card"><h2>สถานะคำขอ (แตะเพื่อกรอง · ยื่นแล้ว = ทั้งหมด)</h2><div class="chips" id="homeStatus"></div></div>
    <div class="card"><h2>ประเภทป่า</h2><div class="chips" id="homeType"></div></div>
    <div class="card"><h2>มติสภา อปท.</h2><div id="homeCouncil" class="dl"></div></div>
    <button class="btn btn-o" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px" onclick="openReportSheet()">
      <span style="font-size:1.1rem">📄</span> ออกรายงาน PDF
    </button>
  </section>

  <section id="v-req" class="view">
    <div class="searchrow">
      <input id="qReq" type="search" placeholder="ค้นหา: สายทาง เลขคำขอ หมายเหตุ" oninput="renderReq()">
    </div>
    <div class="chips" id="fType" style="margin-bottom:8px"></div>
    <div class="chips" id="fArea" style="margin-bottom:8px"></div>
    <div class="chips" id="fStatus" style="margin-bottom:12px"></div>
    <div class="subhd"><h2 id="reqCount"></h2><button class="linkbtn" onclick="openEdit('DB_Requests',null)">+ เพิ่มคำขอ</button></div>
    <div id="reqList"></div>
  </section>

  <section id="v-cnc" class="view">
    <div class="searchrow">
      <input id="qCnc" type="search" placeholder="ค้นหา: อบต. / ทต. / สายทาง" oninput="renderCnc()">
    </div>
    <div class="subhd"><h2 id="cncCount"></h2><button class="linkbtn" onclick="openEdit('DB_Council',null)">+ เพิ่มมติสภา</button></div>
    <div id="cncList"></div>
  </section>

  <section id="v-set" class="view">
    <div class="card">
      <h2>การเชื่อมต่อ</h2>
      <div class="frow"><label>GAS Web App URL (/exec)</label><input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/..../exec"></div>
      <div class="frow"><label>Token</label><input id="cfgToken" type="password" autocomplete="off"></div>
      <div class="btnrow">
        <button class="btn btn-o" onclick="testConn()">ทดสอบ</button>
        <button class="btn btn-p" onclick="saveCfg()">บันทึก</button>
      </div>
    </div>
    <div class="card">
      <h2>ข้อมูลในเครื่อง</h2>
      <div class="dl" id="setInfo"></div>
      <div class="btnrow"><button class="btn btn-o" style="color:var(--red)" onclick="clearLocal()">ล้างข้อมูลในเครื่อง</button></div>
    </div>
  </section>
</main>

<nav>
  <button data-v="home" class="on" onclick="go('home')"><span class="ic">▦</span>ภาพรวม</button>
  <button data-v="req" onclick="go('req')"><span class="ic">🗂</span>คำขอ</button>
  <button data-v="cnc" onclick="go('cnc')"><span class="ic">🏛</span>มติสภา</button>
  <a href="map.html" class="navlink"><span class="ic">🗺</span>แผนที่</a>
  <button data-v="set" onclick="go('set')"><span class="ic">⚙</span>ตั้งค่า</button>
</nav>

<div id="sheetWrap"><div id="sheetBg" onclick="closeSheet()"></div><div id="sheet"><div class="grab"></div><div id="sheetBody"></div></div></div>

<script>
'use strict';
const STATUSES = ['ยื่นแล้ว','รอมติสภา','แจ้งตรวจป่าแล้ว','รอลงตรวจป่า','ลงตรวจแล้ว','เซ็นรายงานแล้ว','ได้รับอนุญาต'];
const STCLS = {'ยื่นแล้ว':'b-gray','รอมติสภา':'b-purple','แจ้งตรวจป่าแล้ว':'b-blue','รอลงตรวจป่า':'b-amber','ลงตรวจแล้ว':'b-green','เซ็นรายงานแล้ว':'b-indigo','ได้รับอนุญาต':'b-teal'};
const FTYPES = ['ป่าสงวนแห่งชาติ','ป่าถาวร (ม.4(1))','ป่าชายเลน'];
const AGENCIES = ['สนง.ป่าไม้ที่ 12','สนง.ป่าชายเลนที่ 10'];
const PROVS = ['กระบี่','นครศรีธรรมราช'];
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let state = {
  tab: 'home',
  data: { requests: [], council: [], routes: [] },
  queue: [],
  fType: '', fStatus: '', fArea: ''
};

/* ---------- IndexedDB ---------- */
let db;
function idb() {
  return new Promise((res, rej) => {
    if (db) return res(db);
    const r = indexedDB.open('forestdb', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('tables');
      d.createObjectStore('queue', { keyPath: 'qid', autoIncrement: true });
      d.createObjectStore('kv');
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return idb().then((d) => new Promise((res, rej) => {
    const t = d.transaction(store, mode);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req ? req.result : undefined);
    t.onerror = () => rej(t.error);
  }));
}
const kvGet = (k) => tx('kv', 'readonly', (s) => s.get(k));
const kvSet = (k, v) => tx('kv', 'readwrite', (s) => s.put(v, k));
const tblGet = (k) => tx('tables', 'readonly', (s) => s.get(k));
const tblSet = (k, v) => tx('tables', 'readwrite', (s) => s.put(v, k));
const qAll = () => tx('queue', 'readonly', (s) => s.getAll());
const qDel = (qid) => tx('queue', 'readwrite', (s) => s.delete(qid));
function qUpsert(table, record) {
  const idCol = table === 'DB_Requests' ? 'req_id' : 'res_id';
  return qAll().then((all) => {
    const dup = all.find((q) => q.table === table && q.record[idCol] === record[idCol]);
    return tx('queue', 'readwrite', (s) => {
      if (dup) s.delete(dup.qid);
      s.add({ table, record });
    });
  }).then(loadQueue);
}
function loadQueue() { return qAll().then((q) => { state.queue = q || []; }); }

/* ---------- helpers ---------- */
function fmtTH(iso) {
  if (!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return iso || '–';
  const y = +iso.slice(0, 4) + 543, m = +iso.slice(5, 7), d = +iso.slice(8, 10);
  return d + ' ' + TH_M[m - 1] + ' ' + y;
}
function nowISO() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
         'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function _sw(opts) {
  if (typeof Swal === 'undefined') { console.warn('[toast]', opts.title); return; }
  Swal.fire(Object.assign({
    toast: true, position: 'top', showConfirmButton: false, timerProgressBar: true,
    didOpen: (el) => { el.addEventListener('mouseenter', Swal.stopTimer); el.addEventListener('mouseleave', Swal.resumeTimer); }
  }, opts));
}
function toast(msg, ms, icon) { _sw({ icon: icon || 'info',    title: msg, timer: ms || 2600 }); }
function toastOk(msg, ms)     { _sw({ icon: 'success', title: msg, timer: ms || 2600 }); }
function toastErr(msg, ms)    { _sw({ icon: 'error',   title: msg, timer: ms || 3600 }); }
function toastWarn(msg, ms)   { _sw({ icon: 'warning', title: msg, timer: ms || 2600 }); }
function isPending(table, id) {
  const idCol = table === 'DB_Requests' ? 'req_id' : 'res_id';
  return state.queue.some((q) => q.table === table && q.record[idCol] === id);
}
// "ยื่นแล้ว" = ทุกคำขอ (ทุกใบยื่นแล้วโดยนิยาม) / สถานะอื่น = เฉพาะใบที่อยู่ขั้นนั้นจริง
function matchStatus(r, s) {
  return s === 'ยื่นแล้ว' ? true : r.status === s;
}
function nextId(prefix, rows, idCol) {
  let mx = 0;
  rows.forEach((r) => { const m = String(r[idCol] || '').match(/(\d+)$/); if (m) mx = Math.max(mx, +m[1]); });
  return prefix + '-' + String(mx + 1).padStart(3, '0');
}
function cfg() {
  return { url: localStorage.getItem('gas_url') || '', token: localStorage.getItem('gas_token') || '' };
}

/* ---------- sync ---------- */
async function apiGet() {
  const c = cfg();
  if (!c.url || !c.token) throw new Error('ยังไม่ได้ตั้งค่า URL/Token (ไปที่แท็บ ตั้งค่า)');
  const r = await fetch(c.url + '?token=' + encodeURIComponent(c.token));
  const j = await r.json();
  if (!j.ok) throw new Error(j.error === 'unauthorized' ? 'Token ไม่ถูกต้อง' : j.error);
  return j;
}
async function apiPost(body) {
  const c = cfg();
  const r = await fetch(c.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(Object.assign({ token: c.token }, body))
  });
  return r.json();
}
async function doSync() {
  const btn = $('#syncBtn');
  if (btn.disabled) return;
  btn.disabled = true; btn.classList.add('busy'); $('#syncTxt').textContent = 'กำลัง sync';
  try {
    let pushed = 0, conflicts = 0;
    for (const q of state.queue.slice()) {
      const res = await apiPost({ action: 'upsert', table: q.table, record: q.record });
      if (res.ok) { await qDel(q.qid); pushed++; }
      else if (res.error === 'conflict') { await qDel(q.qid); conflicts++; }
      else throw new Error(res.error || 'เขียนขึ้นชีตไม่สำเร็จ');
    }
    const j = await apiGet();
    state.data = { requests: j.requests || [], council: j.council || [], routes: j.routes || [] };
    await tblSet('requests', state.data.requests);
    await tblSet('council', state.data.council);
    await tblSet('routes', state.data.routes);
    await kvSet('last_sync', nowISO());
    await loadQueue();
    renderAll();
    let msg = 'Sync สำเร็จ · คำขอ ' + state.data.requests.length + ' รายการ';
    if (pushed) msg += ' · ส่งขึ้นชีต ' + pushed;
    if (conflicts) msg += ' · ข้าม ' + conflicts + ' (ข้อมูลบนชีตใหม่กว่า)';
    toastOk(msg, 3200);
  } catch (err) {
    toastErr('Sync ไม่สำเร็จ: ' + err.message, 3600);
  }
  btn.disabled = false; btn.classList.remove('busy'); $('#syncTxt').textContent = 'Sync';
  refreshMeta();
}

/* ---------- บันทึกแก้ไข (offline-first) ---------- */
async function saveRecord(table, record) {
  record.updated_at = nowISO();
  const idCol = table === 'DB_Requests' ? 'req_id' : 'res_id';
  const key = table === 'DB_Requests' ? 'requests' : 'council';
  const rows = state.data[key];
  const i = rows.findIndex((r) => r[idCol] === record[idCol]);
  if (i >= 0) rows[i] = Object.assign({}, rows[i], record); else rows.push(record);
  await tblSet(key, rows);
  await qUpsert(table, record);
  renderAll();
  closeSheet();
  if (navigator.onLine && cfg().url) { toastOk('บันทึกแล้ว · กำลัง sync ขึ้นชีต'); doSync(); }
  else toastWarn('บันทึกในเครื่องแล้ว · จะขึ้นชีตเมื่อกด Sync ตอนมีเน็ต', 3200);
}

/* ---------- navigation & render ---------- */
function go(v) {
  state.tab = v;
  document.querySelectorAll('.view').forEach((el) => el.classList.remove('on'));
  $('#v-' + v).classList.add('on');
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
}
function renderHome() {
  const R = state.data.requests;
  $('#kReq').textContent = R.length;
  $('#kPend').textContent = state.queue.length;
  $('#homeStatus').innerHTML = STATUSES.map((s) =>
    '<button class="chip" onclick="filterJump(\'\',\'' + s + '\')">' + esc(s) +

function fld(label, name, val, type, opts) {
  if (type === 'select') {
    return '<div class="frow"><label>' + label + '</label><select name="' + name + '">' +
      '<option value=""' + (!val ? ' selected' : '') + '>– ไม่ระบุ –</option>' +
      opts.map((o) => '<option' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>').join('') +
      '</select></div>';
  }
  if (type === 'textarea') return '<div class="frow"><label>' + label + '</label><textarea name="' + name + '" rows="2">' + esc(val) + '</textarea></div>';
  const extra = type === 'route' ? ' list="dlRoutes" inputmode="numeric"' : '';
  return '<div class="frow"><label>' + label + '</label><input name="' + name + '" type="' + (type === 'route' ? 'text' : (type || 'text')) + '"' + extra + ' value="' + esc(val) + '"></div>';

      if (!rows.length) return;
      body += '<tr><td>'+ft+'</td>';
      STATS.forEach(function(s,i){var n=rows.filter(function(r){return r.status===s;}).length;tots[i]+=n;body+='<td class="num">'+(n||'\u2013')+'</td>';});
      body += '<td class="num"><b>'+rows.length+'</b></td></tr>';
    });
    body += '<tr><td><b>รวมทั้งหมด</b></td>'+tots.map(function(n){return '<td class="num"><b>'+(n||'\u2013')+'</b></td>';}).join('')+'<td class="num"><b>'+R.length+'</b></td></tr></table>';
    body += '<h2>สรุปมติสภา อปท.</h2>';
    var cntSent = C.filter(function(c){return c.status==='ส่งแล้ว';}).length;
    var cntRte  = new Set(C.map(function(c){return c.route_no;})).size;
    body += '<div class="sums"><div class="sb"><b>'+cntSent+'</b><small>รายการที่ส่งแล้ว</small></div>' +
      '<div class="sb"><b>'+cntOrg+'</b><small>จำนวน อปท. (ไม่ซ้ำ)</small></div>' +
      '<div class="sb"><b>'+cntRte+'</b><small>สายทางที่มีมติสภา</small></div></div>';
  } else if (type === 'byRoute') {
    var rnos = Array.from(new Set(R.map(function(r){return r.route_no;}))).sort(function(a,b){return String(a).localeCompare(String(b),'th',{numeric:true});});
    rnos.forEach(function(rno){
      var rows = sortR(R.filter(function(r){return r.route_no===rno;}));
      body += '<div class="nb"><h2>ทางหลวงหมายเลข '+rno+' ('+rows.length+' คำขอ)</h2>' +
        '<table><tr><th>ประเภทป่า</th><th>พื้นที่</th><th>เลขคำขอ</th><th>วันยื่น</th><th>เลขหนังสือ</th><th>วันแจ้งตรวจ</th><th>วันลงตรวจ</th><th>EC/EAR</th><th>สถานะ</th><th>หมายเหตุ</th></tr>';
      rows.forEach(function(r){
        body += '<tr><td>'+r.forest_type+'</td><td>'+r.province_area+'</td>' +
          '<td class="num">'+r.request_no+'</td><td>'+isoTH(r.request_date)+'</td>' +
          '<td class="num">'+(r.inspect_notify_no||'\u2013')+'</td><td>'+isoTH(r.inspect_notify_date)+'</td>' +
          '<td>'+isoTH(r.inspect_date)+'</td><td class="num">'+(r.ec_ear||'\u2013')+'</td>' +
          '<td>'+r.status+'</td><td>'+(r.remark||'\u2013')+'</td></tr>';
      });
      body += '</table></div>';
    });
  } else if (type === 'byRequest') {
    var TH = '<th>#</th><th>สายทาง</th><th>ประเภทป่า</th><th>พื้นที่</th><th>เลขคำขอ</th><th>วันยื่น</th><th>เลขหนังสือ</th><th>วันแจ้งตรวจ</th><th>วันลงตรวจ</th><th>สถานะ</th><th>หมายเหตุ</th>';
    body += '<table><tr>'+TH+'</tr>';
    sortR(R).forEach(function(r,i){body+=rowTR(r,i);});
    body += '</table>';
  } else if (type === 'byStatus') {
    STATS.forEach(function(s){
      var rows = R.filter(function(r){return r.status===s;}).slice().sort(function(a,b){var pa=a.province_area||'',pb=b.province_area||'';if(pa!==pb)return pa.localeCompare(pb,'th');return (+a.request_no||0)-(+b.request_no||0);});
      if (!rows.length) return;
      var TH = '<th>สายทาง</th><th>ประเภทป่า</th><th>พื้นที่</th><th>เลขคำขอ</th><th>วันยื่น</th><th>วันแจ้งตรวจ</th><th>วันลงตรวจ</th><th>หมายเหตุ</th>';
      body += '<div class="nb"><h2>'+s+' ('+rows.length+' คำขอ)</h2><table><tr>'+TH+'</tr>';
      rows.forEach(function(r){
        body += '<tr><td>ทล.'+r.route_no+'</td><td>'+r.forest_type+'</td><td>'+r.province_area+'</td>' +
          '<td class="num">'+r.request_no+'</td><td>'+isoTH(r.request_date)+'</td>' +
          '<td>'+isoTH(r.inspect_notify_date)+'</td><td>'+isoTH(r.inspect_date)+'</td>' +
          '<td>'+(r.remark||'\u2013')+'</td></tr>';
      });
      body += '</table></div>';
    });
  } else if (type === 'byAgency') {
    var agencies = Array.from(new Set(R.map(function(r){return r.agency;}))).filter(Boolean);
    agencies.forEach(function(ag){
      var rows = sortR(R.filter(function(r){return r.agency===ag;}));
      body += '<div class="nb"><h2>'+ag+' ('+rows.length+' คำขอ)</h2>';
      FTYPES.forEach(function(ft){
        var sub = sortR(rows.filter(function(r){return r.forest_type===ft;}));
        if (!sub.length) return;
        body += '<div style="font-size:13pt;font-weight:bold;margin:8px 0 4px">'+ft+' ('+sub.length+' คำขอ)</div>' +
          '<table><tr><th>สายทาง</th><th>พื้นที่</th><th>เลขคำขอ</th><th>วันยื่น</th><th>วันแจ้งตรวจ</th><th>วันลงตรวจ</th><th>สถานะ</th><th>หมายเหตุ</th></tr>';
        sub.forEach(function(r){
          body += '<tr><td>ทล.'+r.route_no+'</td><td>'+r.province_area+'</td>' +
            '<td class="num">'+r.request_no+'</td><td>'+isoTH(r.request_date)+'</td>' +
            '<td>'+isoTH(r.inspect_notify_date)+'</td><td>'+isoTH(r.inspect_date)+'</td>' +
            '<td>'+r.status+'</td><td>'+(r.remark||'\u2013')+'</td></tr>';
        });
        body += '</table>';
      });
      body += '</div>';
    });
  }
  var ftLine = '<div class="ft">พิมพ์โดยระบบติดตามคำขอเข้าใช้ประโยชน์ในพื้นที่ป่า — แขวงทางหลวงกระบี่</div>';
  var html = '<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">' +
    '<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">' +
    '<title>'+TITLES[type]+'</title><style>'+css+'</style></head><body><div class="pg">' +
    hdr() + body + ftLine + '</div>' +
    '<script>window.addEventListener("load",function(){setTimeout(function(){window.print();},600);})<\/script>' +
    '</body></html>';
  var blob = new Blob([html],{type:'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var w = window.open(url,'_blank');
  if (!w) { toastErr('เบราว์เซอร์บล็อก popup — กรุณาอนุญาต popup แล้วลองใหม่'); }
  setTimeout(function(){URL.revokeObjectURL(url);},60000);
}

/* ---------- ตั้งค่า ---------- */
function saveCfg() {
  localStorage.setItem('gas_url', $('#cfgUrl').value.trim());
  localStorage.setItem('gas_token', $('#cfgToken').value.trim());
  toastOk('บันทึกการตั้งค่าแล้ว');
}
async function testConn() {
  saveCfg();
  toast('กำลังทดสอบ...', 2000, 'info');
  try {
    const j = await apiGet();
    toastOk('เชื่อมต่อสำเร็จ · คำขอ ' + j.requests.length + ' · มติสภา ' + j.council.length + ' · สายทาง ' + j.routes.length, 3600);
  } catch (err) { toastErr('เชื่อมต่อไม่ได้: ' + err.message, 3600); }
}
async function clearLocal() {
  const result = await Swal.fire({
    title: 'ล้างข้อมูลในเครื่อง?',
    text: 'รายการที่ยังไม่ sync จะหายไปด้วย ข้อมูลบน Google Sheet ไม่กระทบ',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#B91C1C',
    cancelButtonColor: '#6B7280',
    confirmButtonText: 'ล้างข้อมูล',
    cancelButtonText: 'ยกเลิก',
    reverseButtons: true
  });
  if (!result.isConfirmed) return;
  await tblSet('requests', []); await tblSet('council', []); await tblSet('routes', []);
  const q = await qAll();
  for (const it of q) await qDel(it.qid);
  await kvSet('last_sync', '');
  state.data = { requests: [], council: [], routes: [] }; state.queue = [];
  renderAll(); toastOk('ล้างข้อมูลในเครื่องแล้ว');
}

/* ---------- เริ่มต้น ---------- */
function netdot() { $('#netdot').classList.toggle('on', navigator.onLine); }
window.addEventListener('online', netdot);
window.addEventListener('offline', netdot);
(async function init() {
  netdot();
  $('#cfgUrl').value = cfg().url; $('#cfgToken').value = cfg().token;
  state.data.requests = (await tblGet('requests')) || [];
  state.data.council = (await tblGet('council')) || [];
  state.data.routes = (await tblGet('routes')) || [];
  await loadQueue();
  renderAll();
  go(cfg().url ? 'home' : 'set');
  if (!cfg().url) toast('เริ่มต้นใช้งาน: กรอก URL และ Token แล้วกด Sync', 4200, 'info');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
